<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify MFA</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome (Icon) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <style>
        body {
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .verify-card {
            max-width: 420px;
            width: 100%;
            border: none;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            animation: fadeIn 0.4s ease-in-out;
        }

        .otp-input {
            height: 55px;
            font-size: 20px;
            text-align: center;
            letter-spacing: 6px;
            border-radius: 12px;
        }

        .btn-verify {
            height: 50px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: 0.3s ease;
        }

        .btn-verify:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.1);
        }

        .shield-icon {
            font-size: 60px;
            color: #0d6efd;
            background: #e7f1ff;
            padding: 18px;
            border-radius: 50%;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card verify-card p-4 text-center bg-white">
        
        <!-- Icon -->
        <div class="mb-3">
            <i class="fas fa-shield-alt shield-icon"></i>
        </div>

        <!-- Title -->
        <h3 class="fw-bold mb-1">Two-Factor Verification</h3>
        <p class="text-muted mb-4">
            Enter the 6-digit code from your Authenticator app
        </p>

        <!-- Django Messages (Errors/Success) -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert 
                    {% if message.tags == 'error' %}alert-danger
                    {% elif message.tags == 'success' %}alert-success
                    {% else %}alert-info
                    {% endif %}
                    rounded-3">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <!-- Form -->
        <form method="POST" action="{% url 'verify-mfa' %}">
            {% csrf_token %}

            <div class="mb-3">
                <input 
                    type="text" 
                    id="otp_code" 
                    name="otp_code"
                    maxlength="6"
                    class="form-control otp-input"
                    placeholder="••••••"
                    required>
            </div>

            <input type="hidden" name="user_id" value="{{ user_id }}">

            <button class="btn btn-primary btn-verify w-100 shadow-sm" type="submit">
                <i class="fas fa-check-circle me-2"></i> Verify Code
            </button>
        </form>

        <!-- Extra Help -->
        <div class="mt-4">
            <small class="text-muted">
                Didn’t receive a code? Open your Google Authenticator app.
            </small>
        </div>

    </div>

</body>
</html>
